author:
  name: The Under the Surface Project
  email: mark.hall@work.room3b.eu
sphinx_config:
  extensions:
    - myst_parser
    - sphinx_external_toc
    - uedition
    - sphinxcontrib.bibtex
  html_logo: logo.jpg
  bibtex_bibfiles:
    - ../references.bib
  html_theme: pydata_sphinx_theme
  html_theme_options:
    secondary_sidebar_items:
      - page-toc.html
  html_static_path:
    - _static
  html_css_files:
    - style.css
  html_js_files:
    - script.js
  tei:
    blocks:
      - name: div
        selector: tei:div
        tag: div
      - name: heading-2
        selector: tei:head[@type="h2"]
        tag: h3
      - name: heading-4
        selector: tei:head[@type="h4"]
        tag: h4
      - name: line-group
        selector: tei:lg
        tag: div
      - name: line
        selector: tei:l
        tag: div
      - name: closer
        selector: tei:closer
        tag: div
      - name: dummy-linebreak
        selector: tei:lb[@type="dummy"]
        tag: div
      - name: line-break
        selector: tei:lb
        tag: br
    marks:
      - name: page-begin
        selector: tei:pb
        text: "@n"
      - name: italic
        selector: tei:hi[@rend="italic"]
        tag: em
    sections:
      - title: About
        name: metadata
        type: metadata
        selector: /tei:TEI/tei:teiHeader
        fields:
          - title: Author
            type: single
            selector: tei:fileDesc/tei:sourceDesc/tei:biblFull/tei:titleStmt/tei:author/text()
          - title: Bibliographic entry
            type: single
            selector: tei:fileDesc/tei:sourceDesc/tei:biblFull/tei:titleStmt/tei:title/text()
          - title: Source
            type: single
            selector: tei:fileDesc/tei:publicationStmt/tei:idno[@type="TextGridUri"]/text()
      - name: body
        type: text
        title: Text
        selector: tei:text/tei:body
languages:
  - code: en
    label: English
    path: en
  - code: de
    label: Deutsch
    path: de
output: site
repository:
  url: https://github.com/scmmmh/under-the-surface
  branch: main
title:
  en: Under the Surface
  de: Unter der Oberfläche
version: "2"
